<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Auto | Premium Car Marketplace</title>

    <link rel="icon" type="image/x-icon" href="logo.ico">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="logo">Apex<span>Auto</span></div>
        <nav>
            <ul>
                <li><a href="#" class="active">Home</a></li>
                <li><a href="#">Inventory</a></li>
                <li><a href="#">Sell Your Car</a></li>
                <li><a href="#">Financing</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
        <button class="btn-primary">Sign In</button>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Find Your Dream Ride Today</h1>

            <p>Browse thousands of the best new and pre-owned vehicles in Malawi.</p>

        </div>
    </section>

    <!-- Filter Component -->
    <section class="filter-container">
        <div class="filter-box">
            <div class="filter-group">
                <label>Make</label>
                <select id="filter-make">
                    <option value="all">All Makes</option>
                    <option value="tesla">Tesla</option>
                    <option value="bmw">BMW</option>
                    <option value="porsche">Porsche</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Body Type</label>
                <select id="filter-body">
                    <option value="all">All Types</option>
                    <option value="sedan">Sedan</option>
                    <option value="suv">SUV</option>
                    <option value="coupe">Coupe</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Max Price</label>
                <select id="filter-price">
                    <option value="all">Any Price</option>
                    <option value="60000">$60,000</option>
                    <option value="100000">$100,000</option>
                    <option value="150000">$150,000</option>
                </select>
            </div>
            <button class="btn-search" onclick="filterCars()">Search Inventory</button>
        </div>
    </section>

    <!-- Inventory Section -->
    <main class="inventory-section">
        <h2>Featured Vehicles</h2>
        <div class="car-grid" id="car-listings">
            <!-- Dynamic JavaScript content injects here -->
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Apex Auto Marketplace. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
